<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments — SunriseDental</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <p class="breadcrumb">Dentist</p>
        <h1>My Appointments Today</h1>
        <p>Patients scheduled for you today</p>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Appt No</th>
                <th>Patient</th>
                <th>Dentist</th>
                <th>Treatment</th>
                <th>Time</th>
                <th>Status</th>
                <th>Contact</th>
              </tr>
            </thead>
            <tbody id="todayAppointmentsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/common.js?v=7"></script>
  <script src="../js/appointment.js?v=7"></script>
  <script>
    requireAuth(['DENTIST']);
    initAppShell('DENTIST', 'my-appts');
    initTodayAppointmentsPage();
  </script>
</body>
</html>
