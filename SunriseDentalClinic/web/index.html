<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — SunriseDental | Sunrise Dental Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" 
        rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-bg" aria-hidden="true">
    <img
      class="login-bg-img"
      src="images/bg.jpg"
      alt="Sunrise Dental Clinic"
      loading="eager"
    >
  </div>
  <div class="login-overlay" aria-hidden="true"></div>

  <div class="login-wrapper">
    <div class="login-card-premium">
      <div class="login-brand-premium">
        <div class="login-icon-ring">
          <span class="login-tooth-icon">🦷</span>
        </div>
        <h1 class="login-title-serif">Sunrise Dental</h1>
        <p class="login-subtitle-gold">CLINIC MANAGEMENT SYSTEM</p>
        <p class="login-location">Authorized Staff Only</p>
      </div>

      <div class="role-selector">
        <p class="role-selector-label"><span class="role-label-icon">👥</span> Select Staff Role</p>
        <div class="role-cards" id="roleCards">
          <button type="button" class="role-card" data-role="ADMIN">
            <span class="role-card-icon">🛡️</span>
            <span class="role-card-name">Admin</span>
          </button>
          <button type="button" class="role-card active" data-role="RECEPTIONIST">
            <span class="role-card-icon">💼</span>
            <span class="role-card-name">Receptionist</span>
          </button>
          <button type="button" class="role-card" data-role="DENTIST">
            <span class="role-card-icon">🩺</span>
            <span class="role-card-name">Dentist</span>
          </button>
        </div>
      </div>

      <form id="loginForm" class="login-form-premium" novalidate>
        <div class="form-group login-field">
          <label for="username"><span class="field-icon">👤</span> Username</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username">
          <span class="form-error"></span>
        </div>
        <div class="form-group login-field">
          <label for="password"><span class="field-icon">🔒</span> Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password">
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-pressed="false" title="Show password">
              <!-- Open eye = password hidden, click to show -->
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" 
                   stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
              <!-- Slash eye = password visible, click to hide -->
              <svg class="eye-icon eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" 
                   stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"/>
                <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/>
                <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c7 0 10 7 10 7a17.2 17.2 0 0 1-4.06 5.28"/>
                <path d="M6.09 6.09A17.2 17.2 0 0 0 2 12s3 7 10 7a10.8 10.8 0 0 0 5.09-1.27"/>
              </svg>
            </button>
            
          </div>
          <span class="form-error"></span>
        </div>
        <button type="submit" class="btn-login-glow">
          <span>Secure Staff Login</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>
      <div class="login-secure-badge">
        <span>🔐</span> Encrypted Session · HIPAA-Ready Staff Portal
      </div>
    </div>
  </div>
<script src="js/common.js?v=7"></script>
  <script src="js/auth.js?v=7"></script>
</body>
</html>
