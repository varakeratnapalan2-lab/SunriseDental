<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Appointment — SunriseDental</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <p class="breadcrumb">Receptionist</p>
        <h1>Display Appointment Details</h1>
        <p>Search by appointment number to view complete information</p>
      </div>
      <div class="card">
        <form id="searchAppointmentForm" class="search-inline">
          <input type="text" name="appointmentNumber" placeholder="e.g. APT0001" aria-label="Appointment number">
          <button type="submit" class="btn btn-primary btn-sm">Search</button>
        </form>
        <div id="appointmentDetails" class="hidden"></div>
      </div>
    </main>
  </div>
  <script src="../js/common.js?v=7"></script>
  <script src="../js/appointment.js?v=7"></script>
  <script>
    requireAuth(['RECEPTIONIST']);
    initAppShell('RECEPTIONIST', 'search');
    initSearchAppointment();
  </script>
</body>
</html>
