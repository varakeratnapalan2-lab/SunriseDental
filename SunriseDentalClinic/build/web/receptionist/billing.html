<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing — SunriseDental</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Libre+Barcode+128+Text&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <p class="breadcrumb">Receptionist</p>
        <h1>Calculate & Print Bill</h1>
        <p>Treatment cost + consultation fee — print patient receipt</p>
      </div>
      <div class="card">
        <form id="billingForm" class="search-inline no-print">
          <input type="text" name="appointmentNumber" placeholder="Appointment number" required>
          <button type="submit" class="btn btn-primary btn-sm">Calculate Bill</button>
        </form>
        <div id="billReceipt" class="hidden"></div>
      </div>
    </main>
  </div>
  <script src="../js/common.js?v=7"></script>
  <script src="../js/appointment.js?v=7"></script>
  <script src="../js/billing.js?v=7"></script>
  <script>
    requireAuth(['RECEPTIONIST']);
    initAppShell('RECEPTIONIST', 'billing');
    initBillingPage();
  </script>
</body>
</html>
