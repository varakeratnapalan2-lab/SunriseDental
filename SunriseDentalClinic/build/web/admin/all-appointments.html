<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Appointments — SunriseDental</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <p class="breadcrumb">Administrator</p>
        <h1>All Appointments</h1>
        <p>Clinic-wide appointment list</p>
      </div>
      <div class="card">
        <form id="filterForm" class="search-inline">
          <input type="date" name="date" aria-label="Filter date">
          <input type="text" name="dentist" placeholder="Dentist name filter">
          <button type="submit" class="btn btn-secondary btn-sm">Apply Filter</button>
        </form>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Appt No</th>
                <th>Patient</th>
                <th>Dentist</th>
                <th>Treatment</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Contact</th>
              </tr>
            </thead>
            <tbody id="allAppointmentsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/common.js?v=7"></script>
  <script src="../js/appointment.js?v=7"></script>
  <script src="../js/admin.js?v=7"></script>
  <script>
    requireAuth(['ADMIN']);
    initAppShell('ADMIN', 'appointments');
    initAllAppointmentsAdmin();
  </script>
</body>
</html>
